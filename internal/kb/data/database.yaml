rules:
  - id: db-postgres-auth-failed
    error: postgresql password authentication failed
    category: Database
    meaning: The PostgreSQL server rejected the connection because the password supplied for the user does not match or pg_hba.conf rules rejected it.
    exact_matches:
      - "password authentication failed"
      - "fatal: password authentication failed for user"
    patterns:
      - '(?i)FATAL:\s+password authentication failed for user "(?P<user>[^"]+)"'
      - '(?i)pq:\s+password authentication failed for user "(?P<user>[^"]+)"'
    confirmed_templates:
      - "PostgreSQL database user: {{if .user}}{{.user}}{{else}}<user>{{end}}"
      - "Authentication rejected by pg_hba.conf or invalid password"
    likely_cause: Incorrect password configured in database connection string (.env / application config), or pg_hba.conf requires md5/scram-sha-256.
    possible_causes:
      - Typo in password or database user credentials
      - Connection URL has special characters in password that are not URL-encoded
      - pg_hba.conf does not allow connection from client IP or uses peer authentication instead of password
      - User was not created in PostgreSQL
    diagnostic_steps:
      - command: "sudo -u postgres psql -c '\\du'"
        description: "List all PostgreSQL users and verify if target user exists"
      - command: "sudo cat /etc/postgresql/*/main/pg_hba.conf | grep -v '^#'"
        description: "Inspect active client authentication rules"
    potential_solutions:
      - description: "Reset database user password via postgres superuser"
        command: "sudo -u postgres psql -c \"ALTER USER {{if .user}}{{.user}}{{else}}<user>{{end}} WITH PASSWORD 'newpassword';\""
    warnings:
      - "Do not set authentication method to 'trust' in production pg_hba.conf as it allows unauthenticated access."

  - id: db-postgres-too-many-connections
    error: postgresql remaining connection slots reserved
    category: Database
    meaning: The PostgreSQL server has reached its configured max_connections limit, blocking all new non-superuser connections.
    exact_matches:
      - "remaining connection slots are reserved"
      - "too many connections"
    patterns:
      - '(?i)FATAL:\s+remaining connection slots are reserved for non-replication superuser connections'
      - '(?i)FATAL:\s+sorry, too many clients already'
    confirmed_templates:
      - "PostgreSQL client connection pool exhausted (max_connections reached)"
    likely_cause: Applications or web workers opened too many idle database connections without pooling (e.g. PgBouncer), or connections were leaked.
    possible_causes:
      - Missing connection pooling (each web worker opening multiple persistent connections)
      - Application connection leak (connections opened in requests without closing in defer/finally)
      - Long-running idle queries in transaction (idle in transaction)
      - Low max_connections value in postgresql.conf (default is 100)
    diagnostic_steps:
      - command: "sudo -u postgres psql -c 'SELECT count(*), state FROM pg_stat_activity GROUP BY state;'"
        description: "Inspect count of active vs idle connections"
      - command: "sudo -u postgres psql -c 'SHOW max_connections;'"
        description: "Check current configured maximum connection limit"
    potential_solutions:
      - description: "Terminate idle connections"
        command: "sudo -u postgres psql -c \"SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state = 'idle' AND state_change < current_timestamp - INTERVAL '15' MINUTE;\""
      - description: "Deploy a connection pooler like PgBouncer in front of PostgreSQL"
    warnings:
      - "Do not increase max_connections to very large numbers (e.g. >500) without adequate RAM, as each connection consumes work_mem."

  - id: db-mysql-access-denied
    error: mysql access denied for user
    category: Database
    meaning: The MySQL or MariaDB server refused authentication for the specified username, host, or password combination.
    exact_matches:
      - "error 1045 (28000)"
      - "access denied for user"
    patterns:
      - "(?i)ERROR 1045 \\(28000\\):\\s+Access denied for user '(?P<user>[^']+)'@'(?P<host>[^']+)'"
    error_codes:
      - "1045"
    confirmed_templates:
      - "MySQL user: {{if .user}}{{.user}}{{else}}<user>{{end}} connecting from {{if .host}}{{.host}}{{else}}<host>{{end}}"
      - "Access denied by MySQL privilege table (Error 1045)"
    likely_cause: Incorrect password or the user is only granted privileges from 'localhost' rather than remote '%' or specific IP.
    possible_causes:
      - "In MySQL, user@localhost and user@% are separate accounts with different passwords"
      - Typo in password or database credentials
      - Required database was not granted with GRANT ALL PRIVILEGES
    diagnostic_steps:
      - command: "sudo mysql -e \"SELECT user, host, plugin FROM mysql.user;\""
        description: "List MySQL users and their allowed source hostnames/IPs"
    potential_solutions:
      - description: "Grant access to the user from the appropriate host"
        command: "sudo mysql -e \"CREATE USER IF NOT EXISTS '{{if .user}}{{.user}}{{else}}<user>{{end}}'@'%' IDENTIFIED BY 'password'; GRANT ALL PRIVILEGES ON db.* TO '{{if .user}}{{.user}}{{else}}<user>{{end}}'@'%'; FLUSH PRIVILEGES;\""
    warnings:
      - "Always use strong passwords and avoid granting '%' root access."

  - id: db-mysql-socket-error
    error: mysql cannot connect through socket
    category: Database
    meaning: The MySQL client cannot connect to the local server through the Unix domain socket file /var/run/mysqld/mysqld.sock.
    exact_matches:
      - "error 2002 (hy000)"
      - "can't connect to local mysql server through socket"
    patterns:
      - "(?i)ERROR 2002 \\(HY000\\):\\s+Can't connect to local MySQL server through socket '(?P<socket>[^']+)'"
    error_codes:
      - "2002"
    confirmed_templates:
      - "Socket path: {{if .socket}}{{.socket}}{{else}}/var/run/mysqld/mysqld.sock{{end}}"
      - "MySQL client socket connection failed (Error 2002)"
    likely_cause: The MySQL daemon (mysqld / mariadb) is not running or crashed due to misconfiguration or disk full.
    possible_causes:
      - MySQL service is stopped or failed to start
      - Socket file path in /etc/mysql/my.cnf differs between client and server sections
      - Server disk is full, preventing MySQL from creating socket file
    diagnostic_steps:
      - command: "sudo systemctl status mysql || sudo systemctl status mariadb"
        description: "Check status of MySQL or MariaDB system service"
      - command: "sudo tail -n 30 /var/log/mysql/error.log"
        description: "Examine MySQL error log for startup failure cause"
    potential_solutions:
      - description: "Start the MySQL service"
        command: "sudo systemctl start mysql"
    warnings:
      - "Do not delete /var/lib/mysql/ib_logfile* files without clean database shutdown."

  - id: db-redis-oom
    error: redis out of memory (maxmemory exceeded)
    category: Database
    meaning: The Redis server reached its maxmemory configuration limit and cannot allocate memory for new write commands.
    exact_matches:
      - "oom command not allowed"
      - "redis maxmemory"
    patterns:
      - "(?i)OOM command not allowed when used memory > 'maxmemory'"
    confirmed_templates:
      - "Redis instance reached maxmemory threshold; write operations rejected"
    likely_cause: Key evictions are disabled (maxmemory-policy noeviction) or keys lack TTL expiration, causing memory to fill up.
    possible_causes:
      - Redis maxmemory-policy set to 'noeviction' (default), rejecting all writes when full
      - Keys inserted without TTL expiration (SET without EX)
      - Cache growing faster than eviction policy can free memory
    diagnostic_steps:
      - command: "redis-cli info memory"
        description: "Inspect used_memory_human vs maxmemory_human"
      - command: "redis-cli config get maxmemory-policy"
        description: "Check current Redis eviction policy"
    potential_solutions:
      - description: "Change eviction policy to volatile-lru or allkeys-lru"
        command: "redis-cli config set maxmemory-policy allkeys-lru"
      - description: "Increase maxmemory limit in redis.conf"
        command: "redis-cli config set maxmemory 4gb"
    warnings:
      - "Using 'allkeys-lru' will evict unexpired keys when memory is exhausted."
